name: Android Emulator via Tailscale Serve

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duración del emulador (10-330 minutos)'
        required: true
        default: '30'
        type: number

permissions:
  contents: read
  id-token: write

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      DURATION_MINUTES: ${{ inputs.duration_minutes }}
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      DISPLAY: :99

    steps:
      - name: Validate duration
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$DURATION_MINUTES" =~ ^[0-9]+$ ]]; then exit 1; fi
          if (( DURATION_MINUTES < 10 || DURATION_MINUTES > 330 )); then exit 1; fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm xvfb x11vnc python3-websockify novnc unzip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/commandlinetools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-35' 'system-images;android-35;google_apis;x86_64'

      - name: Create Android virtual device
        run: |
          echo 'no' | avdmanager create avd --name github-emulator --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6' --force

      - name: Start virtual display
        run: |
          Xvfb "$DISPLAY" -screen 0 1280x800x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          sleep 2

      - name: Start Android emulator
        shell: bash
        run: |
          set -euo pipefail
          emulator -avd github-emulator -no-audio -no-boot-anim -gpu swiftshader_indirect -accel off -memory 2048 > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          timeout 180 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -q 1; do sleep 5; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Start VNC and noVNC web interface
        run: |
          x11vnc -display "$DISPLAY" -localhost -forever -shared -nopw -rfbport 5900 > /tmp/x11vnc.log 2>&1 &
          websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 3

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Publish noVNC with Tailscale Serve
        run: |
          tailscale serve --bg http://127.0.0.1:6080
          tailscale serve status

      - name: Keep emulator running
        run: |
          echo "El emulador permanecerá activo durante $DURATION_MINUTES minutos."
          sleep "$((DURATION_MINUTES * 60))"

      - name: Cleanup
        if: always()
        run: |
          tailscale serve reset || true
          adb emu kill || true

      - name: Show diagnostic logs on failure
        if: failure()
        run: |
          tail -n 200 /tmp/emulator.log || true
          tail -n 100 /tmp/novnc.log || true
          tail -n 100 /tmp/x11vnc.log || true
